<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Neon Reels</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 24px 16px;
    background: radial-gradient(circle at 50% 15%, #2a0e3a, #0a0510 75%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #f3e8ff;
  }
  h1 {
    margin: 0;
    font-size: 1.2rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    background: linear-gradient(90deg, #ff3fb0, #3ff0ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .cabinet {
    padding: 18px;
    border-radius: 22px;
    background: linear-gradient(160deg, #1c0f2e, #0d0616);
    border: 2px solid #ff3fb055;
    box-shadow: 0 0 30px #ff3fb033, inset 0 0 20px #3ff0ff22;
  }
  .reels {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    background: #0a0510;
    border-radius: 12px;
    padding: 14px;
  }
  .reel-col {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .cell {
    width: 56px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.8rem;
    background: #170c26;
    border: 1px solid #3ff0ff33;
    border-radius: 8px;
  }
  .cell.win { border-color: #ff3fb0; box-shadow: 0 0 12px #ff3fb0aa; animation: pulse 0.6s ease-in-out infinite alternate; }
  .reel-col.spinning .cell { animation: blur 0.09s linear infinite; }
  @keyframes blur { from { transform: translateY(-3px); opacity: 0.6; } to { transform: translateY(3px); opacity: 1; } }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.08); } }
  .controls { display: flex; align-items: center; gap: 16px; }
  .stake-input {
    width: 90px;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid #3ff0ff44;
    background: #170c26;
    color: #f3e8ff;
    font-size: 1rem;
    text-align: center;
  }
  button {
    padding: 10px 28px;
    border-radius: 999px;
    border: none;
    background: linear-gradient(90deg, #ff3fb0, #3ff0ff);
    color: #0a0510;
    font-weight: 800;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .balance { font-size: 1.05rem; font-weight: 700; }
  .balance span { color: #3ff0ff; }
  .result { min-height: 1.4em; font-size: 0.95rem; font-weight: 700; }
  .result.win { color: #ff3fb0; }
  .result.lose { color: #8b7a9e; }
  .note { max-width: 340px; text-align: center; font-size: 0.7rem; color: #6b5f7a; line-height: 1.4; }
</style>
</head>
<body>
  <h1>Neon Reels</h1>
  <div class="balance">Coins: <span id="balance">0</span></div>
  <div class="cabinet">
    <div class="reels" id="reels"></div>
  </div>
  <div class="controls">
    <input class="stake-input" id="stake" type="number" min="1" step="1" value="10" />
    <button id="spinBtn">Spin</button>
  </div>
  <p class="result" id="result"></p>
  <p class="note">
    Self-hosted demo slot. Every spin's outcome is decided server-side by the wallet - this game only
    animates to whatever the server returned, it never picks its own result.
  </p>

<script>
  const SYMBOLS = ["🍒", "🍋", "🔔", "⭐", "7️⃣"];
  const WIN_SYMBOL = "💎";
  const COLS = 5;
  const ROWS = 3;

  const reelsEl = document.getElementById("reels");
  const balanceEl = document.getElementById("balance");
  const resultEl = document.getElementById("result");
  const stakeInput = document.getElementById("stake");
  const spinBtn = document.getElementById("spinBtn");

  const columns = [];
  for (let c = 0; c < COLS; c++) {
    const col = document.createElement("div");
    col.className = "reel-col";
    const cells = [];
    for (let r = 0; r < ROWS; r++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.textContent = randomSymbol(SYMBOLS);
      col.appendChild(cell);
      cells.push(cell);
    }
    reelsEl.appendChild(col);
    columns.push({ el: col, cells });
  }

  function getInitialBalance() {
    const params = new URLSearchParams(window.location.search);
    const coins = params.get("coins");
    return coins ? parseInt(coins, 10) : 0;
  }

  let playerCoins = getInitialBalance();
  let spinning = false;
  updateUIMoney(playerCoins);

  function updateUIMoney(coins) {
    playerCoins = coins;
    balanceEl.textContent = Math.floor(coins).toLocaleString();
  }

  function randomSymbol(pool) {
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function requestSpin(betAmount) {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: "CASINO_SPIN_REQUEST", bet: betAmount }, "*");
    }
  }

  function setSpinningVisual(on) {
    columns.forEach((col) => col.el.classList.toggle("spinning", on));
  }

  function landOutcome(isWin) {
    // Middle row is the payline. On a win, land 💎 across the whole payline;
    // on a loss, land anything except a full-row match of the same symbol.
    columns.forEach((col, i) => {
      col.cells.forEach((cell, r) => {
        cell.classList.remove("win");
        if (isWin && r === 1) {
          cell.textContent = WIN_SYMBOL;
        } else {
          cell.textContent = randomSymbol(SYMBOLS);
        }
      });
    });
    if (isWin) {
      columns.forEach((col) => col.cells[1].classList.add("win"));
    }
  }

  window.addEventListener("message", (event) => {
    if (!event.data) return;

    if (event.data.type === "CASINO_SPIN_RESULT") {
      const win = Number(event.data.win) || 0;
      const multiplier = Number(event.data.multiplier) || 0;

      setSpinningVisual(false);
      landOutcome(win > 0);

      if (win > 0) {
        resultEl.textContent = `Win! +${win} coins (${multiplier}x)`;
        resultEl.className = "result win";
      } else {
        resultEl.textContent = "No win this round.";
        resultEl.className = "result lose";
      }

      updateUIMoney(event.data.balanceAfter);
      spinning = false;
      spinBtn.disabled = false;
    }

    if (event.data.type === "CASINO_SPIN_ERROR") {
      setSpinningVisual(false);
      resultEl.textContent = event.data.message || "Round failed.";
      resultEl.className = "result lose";
      spinning = false;
      spinBtn.disabled = false;
    }
  });

  spinBtn.addEventListener("click", () => {
    if (spinning) return;
    const stake = Math.max(1, Math.floor(Number(stakeInput.value) || 0));
    if (stake > playerCoins) {
      resultEl.textContent = "Not enough coins.";
      resultEl.className = "result lose";
      return;
    }

    spinning = true;
    spinBtn.disabled = true;
    resultEl.textContent = "";
    resultEl.className = "result";
    setSpinningVisual(true);

    requestSpin(stake);
  });
</script>
</body>
</html>
